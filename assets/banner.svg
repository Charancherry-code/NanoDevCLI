<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nano-dev">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee0d6"/>
      <stop offset="1" stop-color="#4fd1c5"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="858" height="238" rx="16" fill="#08090b" stroke="#1b1f24" stroke-width="1.5"/>
  <rect x="1" y="1" width="858" height="238" rx="16" fill="url(#grid)"/>

  <!-- window dots -->
  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text x="104" y="39" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#6f7884">nano-dev — zsh</text>

  <!-- wordmark -->
  <text x="430" y="138" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="86" font-weight="700" letter-spacing="4"
        fill="url(#teal)">NanoDevCLI</text>

  <!-- prompt line -->
  <text x="430" y="188" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="17">
    <tspan fill="#4fd1c5">you ›</tspan><tspan fill="#aab2bd"> a tiny AI coding agent that lives in your terminal</tspan>
  </text>
</svg>
